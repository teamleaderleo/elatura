<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elatura Observer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>Elatura</strong>
        <span class="mode" id="mode">idle</span>
      </header>
      <p>Start a run before opening the test conversation. Responses remain byte-for-byte unchanged.</p>
      <dl>
        <div><dt>Run</dt><dd id="run">none</dd></div>
        <div><dt>Requests</dt><dd id="requests">—</dd></div>
        <div><dt>Bytes observed</dt><dd id="bytes">—</dd></div>
        <div><dt>Latest composer mark</dt><dd id="composer">—</dd></div>
      </dl>
      <div class="actions">
        <button id="start" type="button">Start new run</button>
        <button id="export" type="button" disabled>Export JSON</button>
        <button id="clear" type="button">Clear and stop</button>
      </div>
      <output id="status" aria-live="polite"></output>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
