name: Android notification companion

on:
  push:
    branches: [main]
    paths:
      - "android/notification-companion/**"
      - ".github/workflows/android-notification-companion.yml"
  pull_request:
    paths:
      - "android/notification-companion/**"
      - ".github/workflows/android-notification-companion.yml"

permissions:
  contents: read

concurrency:
  group: android-notification-companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-36" "build-tools;36.0.0"

      - name: Test and assemble debug APK
        shell: bash
        run: >-
          gradle
          -p android/notification-companion
          :app:testDebugUnitTest
          :app:assembleDebug
          --no-daemon
          --stacktrace

      - name: Generate checksum and provenance
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          OUTPUT="android/notification-companion/app/build/outputs/apk/debug"
          cd "${OUTPUT}"
          sha256sum app-debug.apk > app-debug.apk.sha256
          {
            echo "artifact=app-debug.apk"
            echo "sha256=$(cut -d' ' -f1 app-debug.apk.sha256)"
            echo "commit=${BUILD_SHA}"
            echo "workflowRun=${BUILD_RUN_ID}"
            echo "ref=${BUILD_REF}"
          } > BUILD-PROVENANCE.txt

      - name: Upload debug APK bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elatura-notification-companion-debug
          path: |
            android/notification-companion/app/build/outputs/apk/debug/app-debug.apk
            android/notification-companion/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/notification-companion/app/build/outputs/apk/debug/BUILD-PROVENANCE.txt
          if-no-files-found: error
          retention-days: 7
