name: Generate lockfile candidate

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/generate-lockfile-candidate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify direct AJV lock metadata
        run: >-
          node -e 'const fs=require("node:fs");const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
          if(lock.packages?.[""]?.devDependencies?.ajv!=="8.20.0")process.exit(1);
          if(lock.packages?.["node_modules/ajv"]?.version!=="8.20.0")process.exit(1);'
      - name: Commit generated lockfile to disposable branch
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate package lock for direct AJV dependency"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload generated lockfile
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ajv-lockfile-candidate
          path: package-lock.json
          retention-days: 1
